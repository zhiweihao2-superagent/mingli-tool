<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="miniprogram">
<title>时间坐标 · 命理工具</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ornaments.css">
<style>
  .head-line { padding-top: var(--space-4); display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
  .head-line h1 { font-size: var(--fs-h1); line-height: 1.25; }
  .head-line .meta { letter-spacing: 0; }

  .card { margin-top: var(--space-4); background: var(--surface); border: var(--hair); border-radius: var(--radius); padding: var(--space-4); }
  .card h2 { font-size: var(--fs-h3); }
  .card .lead { margin-top: var(--space-2); font-size: var(--fs-meta); color: var(--muted); line-height: 1.75; }

  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-top: var(--space-3); border-top: var(--hair); padding-top: var(--space-3); }
  .kv span { display: block; font-size: var(--fs-micro); color: var(--muted); letter-spacing: .12em; }
  .kv b { display: block; margin-top: 2px; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-h3); letter-spacing: .04em; }

  .rows { list-style: none; margin: var(--space-3) 0 0; padding: 0; }
  .rows li { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; border-top: var(--hair); }
  .rows li:first-child { border-top: 0; }
  .rows b { font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .04em; }
  .rows .meta { text-align: right; letter-spacing: 0; }

  .notice { margin-top: var(--space-4); padding: var(--space-4); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: var(--radius); background: var(--surface); }
  .notice b { display: block; font-family: var(--font-serif); font-size: var(--fs-body); }
  .notice p { margin-top: var(--space-2); font-size: 12px; color: var(--muted); line-height: 1.7; }
  .notice .btn { display: inline-flex; width: auto; margin-top: var(--space-3); line-height: 1; }
</style>
<link rel="stylesheet" href="frame.css">
  <script src="themes/switch.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
</svg>

<header class="mp-top">
<div class="mp-nav">
    <a class="mp-back" href="bazi.html" aria-label="返回"><svg class="ico"><use href="#i-back"/></svg></a>
    <h1 class="head" id="nav-title">时间坐标</h1>
  </div>
</header>

<main class="mp-page">
  <div id="empty" class="notice" hidden>
    <b>还没有出生资料</b>
    <p>这一步要先有本命盘。填一次出生资料就能看。</p>
    <a class="btn" href="input.html">去填写</a>
  </div>

  <div id="error" class="notice" hidden>
    <b>没连上本机排盘服务</b>
    <p id="error-text"></p>
  </div>

  <div id="content" hidden>
    <div class="head-line">
      <h1 class="head" id="title">—</h1>
      <span class="meta" id="subtitle"></span>
    </div>

    <section class="card">
      <h2 class="head">这一段的性质</h2>
      <p class="lead" id="lead"></p>
      <div class="kv">
        <div><span>干支</span><b id="ganzhi">—</b></div>
        <div><span>十神</span><b id="god">—</b></div>
      </div>
    </section>

    <section class="card">
      <h2 class="head">与四柱的关系</h2>
      <ul class="rows" id="relations"></ul>
    </section>

    <section class="card" id="ai-card" hidden>
      <h2 class="head">让 AI 讲这一段</h2>
      <p class="lead" id="ai-lead">把这一段时间放到你的盘上，讲节奏和能做的事。</p>
      <button class="ai-btn" id="cycle-ai" type="button" style="margin-top:var(--space-3)">生成解读</button>
      <div class="ai-result" id="cycle-result"></div>
    </section>
  </div>
</main>

  <script src="boot.js"></script>
<script src="profile.js"></script>
<script src="demo.js"></script>
<script src="cycle.js"></script>
<script src="glossary.js"></script>
<script src="vendor/ai-contract.js"></script>
<script src="vendor/report-structure.js"></script>
<script src="vendor/bazi-knowledge.js"></script>
<script src="ai.js"></script>
<script src="cycle-data.js"></script>
</body>
</html>
