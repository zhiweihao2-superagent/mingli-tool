<style>
  .idline { margin-top: var(--space-3); font-size: 12px; color: var(--muted); letter-spacing: 0; }

  .board {
    margin-top: var(--space-3);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-areas:
      "si wu wei shen"
      "chen mid mid you"
      "mao mid mid xu"
      "yin chou zi hai";
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .p { background: var(--surface); padding: var(--space-2) 4px; min-height: 96px; min-width: 0; display: flex; flex-direction: column; gap: 0; }
  .p-name { font-size: var(--fs-micro); color: var(--muted); letter-spacing: 0; display: flex; justify-content: space-between; gap: 2px; }
  .p-name em { font-style: normal; font-family: var(--font-serif); color: var(--text); white-space: nowrap; }
  .p-star { font-family: var(--font-serif); font-size: var(--fs-meta); font-weight: var(--w-head); line-height: 1.35; color: var(--text); white-space: nowrap; }
  .p-star i { font-style: normal; font-size: var(--fs-micro); color: var(--accent); margin-left: 1px; }
  .p-line { font-size: var(--fs-micro); line-height: 1.5; color: var(--muted); white-space: normal; overflow-wrap: anywhere; }
  .p-spacer { margin-top: auto; }
  .p.on { background: var(--wash); }
  .p.on .p-name { color: var(--accent); font-weight: 600; }
  .p.on .p-name em { color: var(--accent); }

  .mid { grid-area: mid; background: var(--surface); padding: var(--space-3); display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .mid-title { font-family: var(--font-serif); font-size: var(--fs-body); letter-spacing: .06em; }
  .mid-line { font-size: 10px; color: var(--muted); letter-spacing: 0; line-height: 1.6; white-space: nowrap; }
  .hua { display: grid; grid-template-columns: 1fr 1fr; gap: 1px var(--space-2); margin-top: var(--space-1); }
  .hua span { font-size: 10px; letter-spacing: 0; color: var(--text); }
  .hua i { font-style: normal; color: var(--accent); margin-left: 2px; }

  .g-si { grid-area: si; } .g-wu { grid-area: wu; } .g-wei { grid-area: wei; } .g-shen { grid-area: shen; }
  .g-chen { grid-area: chen; } .g-you { grid-area: you; } .g-mao { grid-area: mao; } .g-xu { grid-area: xu; }
  .g-yin { grid-area: yin; } .g-chou { grid-area: chou; } .g-zi { grid-area: zi; } .g-hai { grid-area: hai; }

  .rail { display: flex; gap: var(--space-2); overflow-x: auto; margin: 0 calc(var(--gutter) * -1); padding: 0 var(--gutter) var(--space-1); scroll-snap-type: x mandatory; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .dec { flex: 0 0 74px; scroll-snap-align: start; text-align: center; padding: var(--space-3) 2px; border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); }
  .dec b { display: block; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: 0; }
  .dec span { font-size: 12px; color: var(--muted); }
  .dec.on { background: var(--primary); box-shadow: none; }
  .dec.on b { color: var(--on); }
  .dec.on span { color: var(--primary-ink); opacity: .82; }

  .keypalaces { list-style: none; margin: 0; padding: 0; border-top: var(--hair); }
  /* 辅星多的时候右对齐会挤成两行，这里改成上下两行：主星一行、辅星一行 */
  .keypalaces li { display: grid; gap: 3px; padding: var(--space-3) 0; border-bottom: var(--hair); min-height: 48px; align-content: center; }
  .keypalaces b { font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: 0; }
  .keypalaces .meta { text-align: left; letter-spacing: .02em; font-size: 12px; color: var(--muted); line-height: 1.5; }

  .notice { margin-top: var(--space-4); padding: var(--space-4); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: var(--radius); background: var(--surface); }
  .notice b { display: block; font-family: var(--font-serif); font-size: var(--fs-body); }
  .notice p { margin-top: var(--space-2); font-size: 12px; color: var(--muted); line-height: 1.7; }
  .notice .btn { display: inline-flex; width: auto; align-self: flex-start; margin-top: var(--space-3); line-height: 1; }
  .hour-fix { margin-top: var(--space-3); border-top: var(--hair); padding-top: var(--space-3); }
  .hour-fix-title { font-size: var(--fs-meta); color: var(--muted); }
  .hour-fix-grid { margin-top: var(--space-2); display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  .hour-fix-grid button {
    min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line);
  }
  .hour-fix-grid button b { font-family: var(--font-serif); font-size: var(--fs-body); }
  .hour-fix-grid button span { font-size: var(--fs-micro); color: var(--muted); }
  .hour-fix-grid button:active { background: var(--wash); }
  .who-quick {
    max-width: 120px; min-height: 44px; padding: 0 var(--space-2);
    background: var(--bg); border: var(--hair); border-radius: var(--radius);
    color: var(--text); font-size: var(--fs-meta);
  }
</style>
