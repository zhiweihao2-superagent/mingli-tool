<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="miniprogram">
<title>运势 · 流月 · 命理工具</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ornaments.css">
<style>
  .yearbar {
    margin-top: var(--space-3);
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: var(--space-2);
    padding: var(--space-3) var(--space-2);
    background: var(--surface); border: var(--hair); border-radius: var(--radius);
  }
  .yearbar button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); }
  .yearbar button:disabled { opacity: .35; }
  .yearbar .ico { width: 20px; height: 20px; }
  .yearbar .mid { text-align: center; }
  .yearbar .mid b { display: block; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-h1); line-height: 1.2; letter-spacing: .06em; }
  .yearbar .mid span { font-size: var(--fs-meta); color: var(--muted); letter-spacing: 0; }

  .rail { display: flex; gap: var(--space-2); overflow-x: auto; margin: var(--space-4) calc(var(--gutter) * -1) 0; padding: 0 var(--gutter) var(--space-1); scroll-snap-type: x mandatory; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .mon { flex: 0 0 62px; scroll-snap-align: start; text-align: center; padding: var(--space-3) 2px; border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); }
  .mon b { display: block; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .04em; }
  .mon span { font-size: var(--fs-micro); color: var(--muted); }
  .mon.on { background: var(--primary); box-shadow: none; }
  .mon.on b { color: var(--on); }
  .mon.on span { color: var(--primary-ink); opacity: .82; }

  .mhead { margin-top: var(--space-5); display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
  .mhead b { font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-h1); letter-spacing: .08em; }
  .mhead .meta { letter-spacing: 0; }

  .facts { margin-top: var(--space-3); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
  .fcell { padding: var(--space-3); border: var(--hair); border-radius: var(--radius); background: var(--surface); }
  .fcell span { font-size: var(--fs-meta); color: var(--muted); letter-spacing: .08em; }
  .fcell b { display: block; margin-top: 2px; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .04em; }
  .fcell p { margin-top: 2px; font-size: var(--fs-meta); color: var(--muted); line-height: 1.5; }

  .rel { list-style: none; margin: var(--space-3) 0 0; padding: 0; border-top: var(--hair); }
  .rel li { border-bottom: var(--hair); }
  .rel div { display: flex; align-items: baseline; gap: var(--space-3); padding: var(--space-3) 0; min-height: 52px; }
  .r-idx { flex: 0 0 16px; font-family: var(--font-serif); font-size: var(--fs-meta); color: var(--muted); }
  .r-txt { flex: 1; min-width: 0; }
  .r-txt b { display: block; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .04em; }
  .r-txt p { margin-top: 2px; font-size: var(--fs-meta); color: var(--muted); line-height: 1.6; }

  .notice { margin-top: var(--space-4); padding: var(--space-4); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: var(--radius); background: var(--surface); }
  .notice b { display: block; font-family: var(--font-serif); font-size: var(--fs-body); }
  .notice p { margin-top: var(--space-2); font-size: var(--fs-meta); color: var(--muted); line-height: 1.7; }
  .notice .btn { display: inline-flex; width: auto; align-self: flex-start; margin-top: var(--space-3); line-height: 1; }
</style>
<link rel="stylesheet" href="frame.css">
  <script src="themes/switch.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3.5v2M12 18.5v2M4.5 12h2M17.5 12h2M6.7 6.7l1.4 1.4M15.9 15.9l1.4 1.4M17.3 6.7l-1.4 1.4M8.1 15.9l-1.4 1.4"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="i-time" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-me" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.4"/><path d="M5.5 19.5c1.3-3.2 3.6-4.8 6.5-4.8s5.2 1.6 6.5 4.8"/></symbol>
</svg>

<header class="mp-top">
<div class="mp-nav">
    <h1 class="head">流月</h1>
  </div>
</header>

<main class="mp-page">
  <nav class="mp-seg" aria-label="切换视图">
  <a href="annual.html">流年</a>
  <a class="on" aria-current="page" href="month.html">流月</a>
  <a href="today.html">流日</a>
</nav>

  <div id="empty" class="notice" hidden>
    <b>还没有出生资料</b>
    <p>流月要挂在你的本命盘上。填一次出生资料就能逐年逐月看。</p>
    <a class="btn" href="input.html">去填写</a>
  </div>

  <div id="error" class="notice" hidden>
    <b>没算出这个月的坐标</b>
    <p id="error-text"></p>
      <button type="button" class="btn ghost" id="retry">重试</button>
  </div>

  <div id="content" hidden>
    <div class="yearbar">
      <button type="button" id="prev" aria-label="上一年"><svg class="ico"><use href="#i-left"/></svg></button>
      <div class="mid"><b id="year">—</b><span id="year-meta">—</span><select id="year-pick" class="year-pick" aria-label="选择年份"></select></div>
      <button type="button" id="next" aria-label="下一年"><svg class="ico"><use href="#i-right"/></svg></button>
    </div>

    <div class="rail" id="months" aria-label="十二个流月"></div>

    <div class="mhead">
      <b id="m-ganzhi">—</b>
      <span class="meta" id="m-meta"></span>
    </div>

    <div class="facts" id="m-facts"></div>

    <div class="section-head">
      <h2 class="head">这个月的几处互动</h2>
      <span class="meta" id="m-count"></span>
    </div>
    <ul class="rel" id="m-rel"></ul>

    <section class="card" id="month-ai-card" style="margin-top:var(--space-4)">
      <h2 class="head">让 AI 讲这个月</h2>
      <p class="lead">把这个月的干支放到你的盘上，讲这个月的节奏、适合推进的事和要避开的冲撞；输出经服务端复核。</p>
      <button class="ai-btn" id="month-ai" type="button" style="margin-top:var(--space-3)">生成这个月的解读</button>
      <button class="ai-btn" id="save-month" type="button" style="margin-top:var(--space-2)" disabled>先看解读</button>
        <p class="save-note" id="save-note-month" hidden></p>
      <a class="ai-report-link" id="report-link" href="report.html" hidden>查看完整报告 · 存长图<svg class="ico" style="width:14px;height:14px"><use href="#i-chev"/></svg></a>
      <div class="ai-result" id="month-result"></div>
    </section>
  </div>
</main>

<nav class="mp-tabbar" aria-label="主导航">
  <a href="home.html"><svg class="ico"><use href="#i-today"/></svg>今日</a>
  <a href="bazi.html"><svg class="ico"><use href="#i-chart"/></svg>命盘</a>
  <a class="is-on" href="today.html" aria-current="page"><svg class="ico"><use href="#i-time"/></svg>运势</a>
  <a href="me.html"><svg class="ico"><use href="#i-me"/></svg>我的</a>
</nav>

</html>
