<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="miniprogram">
<title>八字 · 命理工具</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  .idline { margin-top: var(--space-3); font-size: 12px; color: var(--muted); letter-spacing: 0; }

  .pillars { margin-top: var(--space-3); display: grid; grid-template-columns: repeat(4, 1fr); border-top: var(--hair); border-bottom: var(--hair); }
  .pillar { padding: var(--space-3) 4px; text-align: center; }
  .pillar + .pillar { border-left: var(--hair); }
  .p-god { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .p-gan, .p-zhi { display: block; font-family: var(--font-serif); font-weight: var(--w-head); font-size: 26px; line-height: 1.3; letter-spacing: .04em; }
  .p-hide { margin-top: var(--space-1); font-size: 12px; color: var(--muted); line-height: 1.5; min-height: 54px; }
  .p-hide span { display: block; white-space: nowrap; }
  .p-nayin { margin-top: var(--space-2); padding-top: var(--space-1); border-top: 1px dotted var(--line); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .pillar.day .p-gan, .pillar.day .p-god { color: var(--accent); }

  .wu { margin-top: var(--space-4); }
  .wu-row { display: grid; grid-template-columns: 20px 1fr 28px; align-items: center; gap: var(--space-2); margin-top: 6px; }
  .wu-row span { font-size: 12px; color: var(--muted); }
  .wu-row b { font-family: var(--font-serif); font-weight: var(--w-head); font-size: 12px; text-align: right; }
  .wu-bar { height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; }
  .wu-bar i { display: block; height: 100%; background: var(--primary); opacity: .82; }
  .wu-row.top .wu-bar i { background: var(--accent); opacity: .9; }

  .judge { margin-top: var(--space-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
  .jcell { padding: var(--space-3); border: var(--hair); border-radius: var(--radius); background: var(--surface); }
  .jcell span { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  .jcell b { display: block; margin-top: 2px; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .04em; }
  .jcell p { margin-top: 2px; font-size: 12px; color: var(--muted); line-height: 1.5; }

  .shensha { display: flex; flex-wrap: wrap; gap: 6px; }
  .ss { font-size: 12px; color: var(--text); box-shadow: inset 0 0 0 1px var(--line); border-radius: var(--radius); padding: 2px var(--space-2); line-height: 20px; }

  .rail { display: flex; gap: var(--space-2); overflow-x: auto; margin: 0 calc(var(--gutter) * -1); padding: 0 var(--gutter) var(--space-1); scroll-snap-type: x mandatory; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .luck { flex: 0 0 72px; scroll-snap-align: start; text-align: center; padding: var(--space-3) 2px; border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); }
  .luck b { display: block; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .04em; }
  .luck span { font-size: 12px; color: var(--muted); }
  .luck.on { background: var(--primary); box-shadow: none; }
  .luck.on b { color: var(--on); }
  .luck.on span { color: rgba(247, 243, 234, .78); }

  .years { list-style: none; margin: 0; padding: 0; border-top: var(--hair); }
  .years li { border-bottom: var(--hair); }
  .years a { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; min-height: 52px; }
  .years b { font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .06em; }
  .years .now b { color: var(--accent); }
  .years .meta { letter-spacing: 0; }

  .notice { margin-top: var(--space-4); padding: var(--space-4); border: 1px solid rgba(163, 58, 43, .35); border-radius: var(--radius); background: var(--surface); }
  .notice b { display: block; font-family: var(--font-serif); font-size: var(--fs-body); }
  .notice p { margin-top: var(--space-2); font-size: 12px; color: var(--muted); line-height: 1.7; }
  .notice .btn { display: inline-flex; width: auto; align-self: flex-start; margin-top: var(--space-3); line-height: 1; }
  .who-quick {
    max-width: 120px; min-height: 44px; padding: 0 var(--space-2);
    background: var(--bg); border: var(--hair); border-radius: var(--radius);
    color: var(--text); font-size: var(--fs-meta);
  }
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 4.5l1.8 4.7 4.7 1.8-4.7 1.8L12 17.5l-1.8-4.7L5.5 11l4.7-1.8z"/><path d="M18 16.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
</svg>

<header class="mp-top">
  <div class="mp-status">
    <span>9:41</span>
    <span class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.3a9.5 9.5 0 0 1 13 0"/><path d="M4 7.1a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.3" fill="currentColor" stroke="none"/></svg>
      <svg width="27" height="12" viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3.2" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.8" fill="currentColor"/><path d="M25 4v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="currentColor" fill-opacity=".4"/></svg>
    </span>
  </div>
  <div class="mp-nav">
    <a class="mp-back" href="input.html" aria-label="返回出生信息"><svg class="ico"><use href="#i-back"/></svg></a>
    <h1 class="head">八字</h1>
  </div>
</header>

<main class="mp-page">
  <nav class="mp-seg" aria-label="切换命盘体系">
    <a class="on" href="bazi.html" aria-current="page">八字</a>
    <a href="ziwei.html">紫微</a>
    <a href="annual.html">年度</a>
  </nav>

  <div id="empty" class="notice" hidden>
    <b>还没有出生资料</b>
    <p>这张盘需要你的出生年月日。填一次就能同时看到八字和紫微。</p>
    <a class="btn" href="input.html">去填写</a>
  </div>

  <div id="error" class="notice" hidden>
    <b>没有连上本机排盘服务</b>
    <p id="error-text">请确认 127.0.0.1:8765 正在运行。</p>
  </div>

  <div id="content" hidden>
    <div class="idrow">
      <p class="idline" id="idline" style="margin-top:0"></p>
      <select id="who-quick" class="who-quick" aria-label="这次看谁的盘"></select>
      <button class="mini-action" id="save-chart" type="button">存盘面图</button>
    </div>
    <section class="pillars" id="pillars" aria-label="四柱"></section>
    <section class="wu" id="wu" aria-label="五行分布"></section>
    <div class="judge" id="judge"></div>

    <section class="ai-card" aria-label="AI 解读">
      <div class="ai-head">
        <span class="ai-tag">AI</span>
        <h2 class="ai-title" id="ai-title">解读</h2>
      </div>
      <p class="ai-body" id="ai-body"></p>
      <div class="ai-actions">
        <button class="ai-btn" type="button"><svg class="ico"><use href="#i-spark"/></svg>生成完整解读（7 个主题）</button>
        <span class="ai-note" id="ai-note"></span>
      </div>
      <div class="ai-result" id="ai-result"></div>
      <a class="ai-report-link" id="report-link" href="report.html" hidden>查看完整报告 · 存长图<svg class="ico" style="width:14px;height:14px"><use href="#i-chev"/></svg></a>
    </section>

    <div class="section-head">
      <h2 class="head">神煞</h2>
      <span class="meta" id="shensha-count"></span>
    </div>
    <div class="shensha" id="shensha"></div>

    <div class="section-head">
      <h2 class="head">大运</h2>
      <span class="meta" id="luck-meta"></span>
    </div>
    <div class="rail" id="luck" aria-label="大运"></div>

    <div class="section-head">
      <h2 class="head">流年</h2>
      <a class="more" href="annual.html">年度解读<svg class="ico" style="width:14px;height:14px"><use href="#i-chev"/></svg></a>
    </div>
    <ul class="years" id="years"></ul>
  </div>
</main>

<script src="vendor/ai-contract.js"></script>
<script src="vendor/report-structure.js"></script>
<script src="vendor/bazi-knowledge.js"></script>
<script src="limits.js"></script>
<script src="ai.js"></script>
<script src="profile.js"></script>
<script src="who-quick.js"></script>
<script src="chart-image.js"></script>
<script src="glossary.js"></script>
<script src="bazi-data.js"></script>
</body>
</html>
