<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="miniprogram">
<title>八字 · 命理工具</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ornaments.css">
<style>
  .idline { margin-top: var(--space-3); font-size: var(--fs-meta); color: var(--muted); letter-spacing: 0; }

  .pillars { margin-top: var(--space-3); display: grid; grid-template-columns: repeat(4, 1fr); border-top: var(--hair); border-bottom: var(--hair); }
  .pillar { padding: var(--space-3) 4px; text-align: center; }
  .pillar + .pillar { border-left: var(--hair); }
  .p-god { font-size: var(--fs-meta); color: var(--muted); letter-spacing: .08em; }
  .p-gan, .p-zhi { display: block; font-family: var(--font-serif); font-weight: var(--w-head); font-size: 26px; line-height: 1.3; letter-spacing: .04em; }
  .p-hide { margin-top: var(--space-1); font-size: var(--fs-meta); color: var(--muted); line-height: 1.5; min-height: 54px; }
  .p-hide span { display: block; white-space: nowrap; }
  .p-nayin { margin-top: var(--space-2); padding-top: var(--space-1); border-top: 1px dotted var(--line); font-size: var(--fs-meta); color: var(--muted); letter-spacing: .04em; }
  .pillar.day .p-gan, .pillar.day .p-god { color: var(--accent); }

  .wu { margin-top: var(--space-4); }
  .wu-row { display: grid; grid-template-columns: 20px 1fr 28px; align-items: center; gap: var(--space-2); margin-top: 6px; }
  .wu-row span { font-size: var(--fs-meta); color: var(--muted); }
  .wu-row b { font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-meta); text-align: right; }
  .wu-bar { height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; }
  .wu-bar i { display: block; height: 100%; background: var(--primary); opacity: .82; }
  .wu-row.top .wu-bar i { background: var(--accent); opacity: .9; }

  .judge { margin-top: var(--space-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
  .jcell { padding: var(--space-3); border: var(--hair); border-radius: var(--radius); background: var(--surface); }
  .jcell span { font-size: var(--fs-meta); color: var(--muted); letter-spacing: .08em; }
  .jcell b { display: block; margin-top: 2px; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .04em; }
  .jcell p { margin-top: 2px; font-size: var(--fs-meta); color: var(--muted); line-height: 1.5; }

  .shensha { display: flex; flex-wrap: wrap; gap: 6px; }
  .ss { font-size: var(--fs-meta); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); border-radius: var(--radius); padding: 2px var(--space-2); line-height: 20px; }

  .rail { display: flex; gap: var(--space-2); overflow-x: auto; margin: 0 calc(var(--gutter) * -1); padding: 0 var(--gutter) var(--space-1); scroll-snap-type: x mandatory; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .luck { flex: 0 0 76px; scroll-snap-align: start; text-align: center; padding: var(--space-3) 2px; border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); }
  #luck-meta { text-align: right; white-space: normal; line-height: 1.35; max-width: 58%; }
  .luck b { display: block; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .04em; white-space: nowrap; }
  .luck span { font-size: var(--fs-meta); color: var(--muted); }
  .luck.on { background: var(--primary); box-shadow: none; }
  .luck.on b { color: var(--on); }
  .luck.on span { color: var(--primary-ink); opacity: .82; }

  .years { list-style: none; margin: 0; padding: 0; border-top: var(--hair); }
  .years li { border-bottom: var(--hair); }
  .years a { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; min-height: 52px; }
  .years b { font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .06em; }
  .years .now b { color: var(--accent); }
  .years .meta { letter-spacing: 0; }

  .notice { margin-top: var(--space-4); padding: var(--space-4); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: var(--radius); background: var(--surface); }
  .notice b { display: block; font-family: var(--font-serif); font-size: var(--fs-body); }
  .notice p { margin-top: var(--space-2); font-size: var(--fs-meta); color: var(--muted); line-height: 1.7; }
  .notice .btn { display: inline-flex; width: auto; align-self: flex-start; margin-top: var(--space-3); line-height: 1; }
  .next-step {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    min-height: 60px; margin-top: var(--space-5); padding: var(--space-3) 0;
    border-top: var(--hair); border-bottom: var(--hair);
  }
  .next-step b { display: block; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .06em; }
  .next-step .meta { display: block; margin-top: 2px; }
  .who-quick {
    max-width: 120px; min-height: 44px; padding: 0 var(--space-2);
    background: var(--bg); border: var(--hair); border-radius: var(--radius);
    color: var(--text); font-size: var(--fs-meta);
  }
</style>
<link rel="stylesheet" href="frame.css">
  <script src="themes/switch.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 4.5l1.8 4.7 4.7 1.8-4.7 1.8L12 17.5l-1.8-4.7L5.5 11l4.7-1.8z"/><path d="M18 16.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>

</svg>

<header class="mp-top">
<div class="mp-nav">
    <h1 class="head">八字</h1>
  </div>

<main class="mp-page">
  <nav class="mp-seg" aria-label="切换视图">
  <a class="on" aria-current="page" href="bazi.html">八字</a>
  <a href="ziwei.html">紫微</a>

  <div id="empty" class="notice" hidden>
    <b>还没有出生资料</b>
    <p>这张盘需要你的出生年月日。填一次就能同时看到八字和紫微。</p>
    <a class="btn" href="input.html">去填写</a>
  </div>

  <div id="error" class="notice" hidden>
    <b>没有连上本机排盘服务</b>
    <p id="error-text"></p>
      <button type="button" class="btn ghost" id="retry">重试</button>
  </div>

  <div id="content" hidden>
    <div class="idrow">
      <p class="idline" id="idline" style="margin-top:0"></p>
      <select id="who-quick" class="who-quick" aria-label="这次看谁的盘"></select>
      <button class="mini-action" id="save-chart" type="button">存盘面图</button>
    </div>
    <section class="pillars" id="pillars" aria-label="四柱"></section>
    <section class="wu" id="wu" aria-label="五行分布"></section>
    <div class="judge" id="judge"></div>

    <section class="ai-card" aria-label="AI 解读">
      <div class="ai-head">
        <span class="ai-tag">AI</span>
        <h2 class="ai-title" id="ai-title">解读</h2>
      </div>
      <p class="ai-body" id="ai-body"></p>
      <div class="ai-actions">
        <button class="ai-btn" type="button"><svg class="ico"><use href="#i-spark"/></svg>生成完整解读（7 个主题）</button>
        <span class="ai-note" id="ai-note"></span>
      </div>
      <div class="ai-result" id="ai-result"></div>
      <a class="ai-report-link" id="report-link" href="report.html" hidden>查看完整报告 · 存长图<svg class="ico" style="width:14px;height:14px"><use href="#i-chev"/></svg></a>
    </section>

    <div class="section-head">
      <h2 class="head">神煞</h2>
      <span class="meta" id="shensha-count"></span>
    </div>
    <div class="shensha" id="shensha"></div>

    <div class="section-head">
      <h2 class="head">大限</h2>
      <span class="meta" id="luck-meta"></span>
    </div>
    <div class="rail" id="luck"></div>

    <a class="next-step" href="annual.html">
      <span>
        <b>流年 · 流月 · 流日</b>
        <span class="meta">在「运势」里按年、按月、按天看这一年的变化</span>
      </span>
      <svg class="ico" style="width:16px;height:16px"><use href="#i-chev"/></svg>
    </a>
  </div>
