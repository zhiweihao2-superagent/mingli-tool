<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="miniprogram">
<title>今日 · 命理工具</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ornaments.css">
<style>
  .top { display: flex; align-items: flex-start; justify-content: space-between; padding-top: var(--space-4); }
  .top h1 { font-size: var(--fs-h1); line-height: 1.3; margin-top: var(--space-2); }
  .top .seal { margin-top: var(--space-1); }

  .hero { margin-top: var(--space-4); background: var(--surface); border: var(--hair); border-radius: var(--radius); overflow: hidden; }
  .hero-art { height: 132px; border-bottom: var(--hair); }
  .hero-art svg { width: 100%; height: 100%; }
  .hero-body { padding: var(--space-4) var(--space-5) var(--space-4); }
  .hero-title { font-size: var(--fs-h1); line-height: 1.3; margin: var(--space-2) 0 0; }
  .hero-title small { font-family: var(--font-sans); font-size: var(--fs-meta); color: var(--muted); letter-spacing: .04em; margin-left: var(--space-2); }
  .hero-btn { width: 100%; margin-top: var(--space-4); }
  .hero-btn .ico { width: 18px; height: 18px; }

  .dayline { display: flex; align-items: baseline; gap: var(--space-2); padding-top: var(--space-2); }
  .dayline b { font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-h1); letter-spacing: .08em; }
  .term { font-size: 12px; letter-spacing: .14em; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 2px; padding: 0 6px; line-height: 20px; }
  .datepair { margin-top: var(--space-3); display: grid; grid-template-columns: 1fr 1fr; border-top: var(--hair); border-bottom: var(--hair); }
  .datepair div { padding: var(--space-3) 0; }
  .datepair div + div { border-left: var(--hair); padding-left: var(--space-4); }
  .datepair span { display: block; font-size: var(--fs-micro); color: var(--muted); letter-spacing: .16em; }
  .datepair b { display: block; margin-top: 2px; font-family: var(--font-serif); font-weight: var(--w-head); font-size: var(--fs-body); letter-spacing: .04em; }
  .plate-note { margin-top: var(--space-2); font-size: var(--fs-micro); color: var(--muted); }
  .week { list-style: none; margin: var(--space-4) 0 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
  .week li { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); font-size: var(--fs-meta); color: var(--muted); }
  .week i { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); }
  .week .done i { box-shadow: none; background: radial-gradient(circle at 46% 46%, color-mix(in srgb, var(--primary) 88%, transparent) 0 40%, color-mix(in srgb, var(--primary) 52%, transparent) 56%, color-mix(in srgb, var(--primary) 12%, transparent) 68%, transparent 72%); }
  .week .today { color: var(--accent); font-weight: 600; }
  .week .today i { box-shadow: inset 0 0 0 1px var(--accent); background: radial-gradient(circle, var(--accent) 0 3px, transparent 3.5px); }


  .plates { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  .plate { display: block; min-width: 0; }
  .plate-art { height: 68px; border: var(--hair); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .plate-art svg { width: 100%; height: 100%; }
  .plate h3 { font-size: 13px; margin-top: var(--space-2); line-height: 1.35; letter-spacing: .04em; }
  .plate .meta { margin-top: 2px; font-size: var(--fs-micro); line-height: 1.45; }

  .recent { list-style: none; margin: 0; padding: 0; border-top: var(--hair); }
  .recent li { border-bottom: var(--hair); }
  .recent a { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; min-height: 56px; }
  .r-mark { flex: 0 0 40px; height: 40px; display: grid; place-items: center; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); font-family: var(--font-serif); font-size: var(--fs-h3); color: var(--primary); }
  .r-txt { flex: 1; min-width: 0; }
  .r-txt b { display: block; font-weight: 500; }
  .recent .chev { flex: 0 0 24px; color: var(--muted); }
  .recent .chev .ico { width: 18px; height: 18px; }

  .recent-empty { margin: 0; padding: var(--space-4) 0; border-top: var(--hair); font-size: var(--fs-small); color: var(--muted); line-height: 1.7; }


  .switch { flex: 0 0 auto; width: 46px; height: 28px; border-radius: var(--radius-pill); background: var(--primary); position: relative; }
  .switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); }
</style>
<link rel="stylesheet" href="frame.css">
  <script src="themes/switch.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <defs>
    <filter id="blur-s" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="blur-m" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur-l" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3.5v2M12 18.5v2M4.5 12h2M17.5 12h2M6.7 6.7l1.4 1.4M15.9 15.9l1.4 1.4M17.3 6.7l-1.4 1.4M8.1 15.9l-1.4 1.4"/></symbol>
  <symbol id="i-cycle" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 0 1 12.8-5.3L20 9"/><path d="M20 4.5V9h-4.5"/><path d="M19.5 12a7.5 7.5 0 0 1-12.8 5.3L4 15"/><path d="M4 19.5V15h4.5"/></symbol>
  <symbol id="i-journal" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="1.5"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></symbol>
  <symbol id="i-me" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M12 4.5a5 5 0 0 0-5 5v3.2L5.5 16h13L17 12.7V9.5a5 5 0 0 0-5-5z"/><path d="M10 18.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.2 8.8l-2 4.4-4.4 2 2-4.4z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-cycle" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 0 1 12.8-5.3L20 9"/><path d="M20 4.5V9h-4.5"/><path d="M19.5 12a7.5 7.5 0 0 1-12.8 5.3L4 15"/><path d="M4 19.5V15h4.5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="i-time" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
</svg>

<header class="mp-top">

  <div class="mp-nav custom">
    <span class="brand"><b>命理工具</b></span>
  </div>
</header>

<main class="mp-page" style="padding-top:0">
  <div class="top">
    <div>
      <p class="dayline"><b>今日</b><span class="term" id="today-term" hidden></span></p>
    </div>
    <a class="seal" href="me.html" aria-label="我的资料与设置">命</a>
  </div>

  <div class="datepair" aria-label="今天对应的公历与农历">
    <div><span>公历</span><b id="today-solar">—</b></div>
    <div><span>农历</span><b id="today-lunar">—</b></div>
  </div>

  <section class="hero">
    <div class="hero-art">
      <svg viewBox="0 0 343 132" preserveAspectRatio="xMidYMid slice" role="img" aria-label="晨光里的远山">
        <defs>
          <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--wash)"/><stop offset="1" stop-color="var(--surface)"/></linearGradient>
          <linearGradient id="h-far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--art-ink)" stop-opacity=".22"/><stop offset="1" stop-color="var(--art-ink)" stop-opacity="0"/></linearGradient>
          <linearGradient id="h-mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--art-ink)" stop-opacity=".44"/><stop offset=".8" stop-color="var(--art-ink)" stop-opacity=".05"/></linearGradient>
          <linearGradient id="h-near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--art-ink)" stop-opacity=".74"/><stop offset="1" stop-color="var(--art-ink)" stop-opacity=".3"/></linearGradient>
        </defs>
        <rect x="-10" y="-10" width="363" height="160" fill="url(#h-sky)"/>
        <circle cx="258" cy="40" r="34" fill="var(--surface)" opacity=".7" filter="url(#blur-l)"/>
        <circle cx="258" cy="40" r="18" fill="var(--art-sun)" opacity=".82"/>
        <path d="M-10 86 C20 74 42 56 70 52 C92 48 104 68 124 64 C150 58 160 36 188 34 C214 32 228 58 250 62 C274 66 292 54 314 58 C332 62 344 70 356 74 V150 H-10Z" fill="url(#h-far)" filter="url(#blur-m)"/>
        <path d="M-10 104 C20 94 40 80 62 80 C84 80 92 94 112 92 C136 90 150 70 174 72 C196 74 202 90 224 94 C248 98 264 84 286 86 C308 88 326 100 356 102 V150 H-10Z" fill="url(#h-mid)" filter="url(#blur-s)"/>
        <ellipse cx="171" cy="98" rx="210" ry="12" fill="var(--surface)" opacity=".9" filter="url(#blur-l)"/>
        <path d="M-10 122 C30 114 52 108 80 112 C104 116 118 106 142 108 C170 110 184 120 212 120 C242 120 258 112 288 114 C312 116 330 120 356 124 V150 H-10Z" fill="url(#h-near)" filter="url(#blur-s)"/>
        <g fill="none" stroke="var(--art-ink)" stroke-opacity=".45" stroke-width="1" stroke-linecap="round">
          <path d="M196 34q3-3 6 0q3-3 6 0"/>
          <path d="M214 26q2-2 4 0q2-2 4 0"/>
        </g>
      </svg>
    </div>
    <div class="hero-body">
      <p class="eyebrow">今日流日</p>
      <h2 class="head hero-title" id="today-hero">—</h2>
      <p class="meta" id="today-meta"></p>
      <a class="btn hero-btn" href="today.html">看今日流日 <svg class="ico"><use href="#i-arrow"/></svg></a>
    </div>
  </section>

  <div class="section-head">
    <div>
      <h2 class="head">快捷入口</h2>
    </div>
  </div>
  <div class="plates">
    <a class="plate" href="bazi.html">
      <div class="plate-art">
        <svg viewBox="0 0 196 112" preserveAspectRatio="xMidYMid slice" role="img" aria-label="四柱排布">
          <rect x="-10" y="-10" width="216" height="132" fill="var(--surface-2)"/>
          <g stroke="var(--art-ink)" stroke-opacity=".28" stroke-width="1">
            <path d="M34 18v76M64 18v76M94 18v76M124 18v76M154 18v76"/>
            <path d="M22 30h144M22 58h144M22 86h144"/>
          </g>
          <g fill="var(--art-ink)" fill-opacity=".8">
            <rect x="40" y="36" width="18" height="4" rx="2"/><rect x="40" y="64" width="18" height="4" rx="2"/>
            <rect x="70" y="36" width="18" height="4" rx="2"/><rect x="70" y="64" width="18" height="4" rx="2"/>
            <rect x="100" y="36" width="18" height="4" rx="2"/><rect x="100" y="64" width="18" height="4" rx="2"/>
          </g>
          <rect x="130" y="36" width="18" height="4" rx="2" fill="var(--art-sun)"/>
          <rect x="130" y="64" width="18" height="4" rx="2" fill="var(--art-sun)"/>
        </svg>
      </div>
      <h3 class="head">八字</h3>
      <p class="meta">四柱 · 旺衰 · 格局</p>
    </a>
    <a class="plate" href="ziwei.html">
      <div class="plate-art">
        <svg viewBox="0 0 196 112" preserveAspectRatio="xMidYMid slice" role="img" aria-label="十二宫方盘">
          <rect x="-10" y="-10" width="216" height="132" fill="var(--surface-2)"/>
          <rect x="66" y="22" width="64" height="64" fill="none" stroke="var(--art-ink)" stroke-opacity=".35"/>
          <path d="M98 22v64M66 54h64" stroke="var(--art-ink)" stroke-opacity=".28"/>
          <circle cx="98" cy="54" r="8" fill="none" stroke="var(--art-sun)"/>
          <g fill="var(--art-ink)" fill-opacity=".7">
            <circle cx="82" cy="38" r="2"/><circle cx="114" cy="38" r="2"/><circle cx="82" cy="70" r="2"/><circle cx="114" cy="70" r="2"/>
          </g>
        </svg>
      </div>
      <h3 class="head">紫微</h3>
      <p class="meta">十二宫 · 主星 · 四化</p>
    </a>
    <a class="plate" href="annual.html">
      <div class="plate-art">
        <svg viewBox="0 0 196 112" preserveAspectRatio="xMidYMid slice" role="img" aria-label="流运时间轴">
          <rect x="-10" y="-10" width="216" height="132" fill="var(--surface-2)"/>
          <path d="M18 78h160" stroke="var(--art-ink)" stroke-opacity=".35"/>
          <g fill="var(--art-ink)" fill-opacity=".75">
            <circle cx="42" cy="78" r="4"/><circle cx="78" cy="78" r="4"/><circle cx="150" cy="78" r="4"/>
          </g>
          <circle cx="114" cy="78" r="6" fill="var(--art-sun)"/>
          <g stroke="var(--art-ink)" stroke-opacity=".3" stroke-linecap="round"><path d="M42 66v-10M78 66v-16M114 62v-22M150 66v-12"/></g>
        </svg>
      </div>
      <h3 class="head">流运</h3>
      <p class="meta">流年 · 流月 · 流日</p>
    </a>
  </div>

  <div class="section-head">
    <h2 class="head">最近解读</h2>
    <a class="more" href="journal.html">全部记录</a>
  </div>
  <p class="recent-empty" id="recent-note">还没有生成过解读。去命盘排一张盘、点「生成解读」，这里就会出现最近三条。</p>
  <ul class="recent" id="recent-list" hidden></ul>

</main>
