<!doctype html>

<meta charset="utf-8">

<style>
  :root{
    --paper:#f0e5cb; --ink:#1a140f; --zhu:#a32b1c; --faint:#5b4f43; --line:rgba(26,20,15,.22);
    --deep:#e7d9b8;
  }
  *{box-sizing:border-box}
  html{scrollbar-width:none;-ms-overflow-style:none}
  html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}
  body{
    margin:0; padding:0 0 48px;
    background:var(--paper) url("art/fuyao/paper-deep-tile.png") 0 0/600px 600px;
    color:var(--ink);
    font:16px/1.7 "Songti SC","SimSun","Noto Serif CJK SC",serif;
    -webkit-tap-highlight-color:transparent;
  }
  a{color:inherit;text-decoration:none}
  header{
    display:flex; align-items:baseline; gap:12px;
    margin:0 24px; padding:20px 0 12px; border-bottom:2px solid var(--ink);
  }
  header h1{margin:0; font-size:22px; letter-spacing:.06em}
  header .sub{font-size:12.5px; color:var(--faint)}
  header .seal{
    margin-left:auto; width:34px; height:34px; border:1.5px solid var(--zhu); color:var(--zhu);
    display:grid; place-items:center; font-size:15px; line-height:1; align-self:center;
  }
  main{margin:0 24px}
  .sec{margin-top:26px}
  .sec-head{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding-bottom:7px;
  }
  .sec-head h2{
    margin:0; font-size:16.5px; letter-spacing:.08em; position:relative; padding-left:9px;
  }
  .sec-head h2::before{
    content:""; position:absolute; left:0; top:3px; width:2.5px; height:13px; background:var(--zhu);
  }
  .sec-head span{margin-left:auto; font-size:12px; color:var(--faint)}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:16px; margin-top:16px;
  }
  .card{margin:0; border:1px solid var(--line); background:rgba(255,252,244,.42)}
  .thumb{
    display:block; height:150px; display:grid; place-items:center; padding:10px;
    border-bottom:1px solid var(--line);
    background:
      linear-gradient(45deg,rgba(26,20,15,.045) 25%,transparent 25%,transparent 75%,rgba(26,20,15,.045) 75%),
      linear-gradient(45deg,rgba(26,20,15,.045) 25%,transparent 25%,transparent 75%,rgba(26,20,15,.045) 75%),
      #f6eeda;
    background-position:0 0,8px 8px; background-size:16px 16px;
  }
  .thumb img{max-width:100%; max-height:100%; object-fit:contain; display:block}
  figcaption{padding:9px 11px 11px; font-size:12.5px; line-height:1.55}
  figcaption b{display:block; font-size:14px; letter-spacing:.03em; margin-bottom:2px}
  figcaption i{display:block; font-style:normal; color:var(--faint)}
  .meta{display:block; color:var(--faint); font-size:11.5px; margin-top:5px; letter-spacing:.02em}
  .use{display:block; margin-top:5px; padding-top:5px; border-top:1px dotted var(--line); font-size:11.5px}
  code{display:block; margin-top:6px; font:11px/1.4 ui-monospace,Consolas,monospace; color:var(--faint); word-break:break-all}
  footer{margin:34px 24px 0; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--faint)}
  footer code{display:inline; margin:0; font-size:11.5px}
  @media (max-width:560px){
    header,main,footer{margin-left:16px; margin-right:16px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:12px}
    .thumb{height:118px}
  }
</style>
</head>
