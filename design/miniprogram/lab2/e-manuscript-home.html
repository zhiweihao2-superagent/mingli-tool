<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日 · 命理工具</title><link rel="stylesheet" href="e-manuscript.css"></head><body><div class="page"><header class="mast"><span>命理工具</span><span class="seal" aria-label="命印">命</span></header><main><div class="intro"><div class="date">庚午年 四月廿一 午时</div><h1 class="today-title">今日</h1></div><section class="manuscript double" aria-label="今日批语"><p class="prose">庚午年生人，金气偏旺，火土相扶。今年丙午，虚岁三十七，行乙酉大运。流年之忌落于大限命宫，事多找上门来，宜先应，不宜躲。财帛受冲，进出易超预算，量入为出为上。夫妻无冲无合，相处如常。</p><aside class="notes" aria-label="朱批"><span>金旺</span><span>忌入命</span><span>财冲</span></aside></section><div class="months"><div><strong>宜备</strong>六月乙未</div><div><strong>宜缓</strong>五月甲午 · 正月庚寅 · 二月辛卯</div></div></main><nav class="nav" aria-label="页面导航"><a href="e-manuscript-home.html" aria-current="page">今日</a><span>·</span><a href="e-manuscript-bazi.html">八字</a><span>·</span><a href="e-manuscript-ziwei.html">紫微</a></nav></div></body></html>
