<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 240" fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true">
  <!-- 符箓竖条：48×240，竖着贴在页面右侧边或页脚。
       意在“符头 / 符胆 / 符脚”三段：顶部三勾为符头，中段符胆写意（不写字，只走笔势），
       底部收成须状。只用 currentColor 描线，朱色点睛取朱色变量。 -->
  <!-- 外框：双线，开口朝下的符形 -->
  <path d="M 8 6 H 40 V 214" stroke-width="1"/>
  <path d="M 11 10 H 37 V 210" stroke-width=".5"/>

  <!-- 符头：三勾 -->
  <path d="M 16 24 H 32" stroke-width="1.6"/>
  <path d="M 24 24 V 34" stroke-width="1.2"/>
  <path d="M 18 34 Q 24 30 30 34" stroke-width="1.1"/>
  <path d="M 15 41 Q 24 37 33 41" stroke-width=".9"/>

  <!-- 符胆：居中一条走笔的竖势，两侧短挑 -->
  <path d="M 24 52 V 150" stroke-width="1.5"/>
  <path d="M 18 62 H 30" stroke-width=".9"/>
  <path d="M 16 74 H 32" stroke-width=".9"/>
  <path d="M 18 86 H 30" stroke-width=".9"/>
  <path d="M 15 98 H 33" stroke-width="1.1"/>
  <path d="M 18 110 H 30" stroke-width=".9"/>
  <path d="M 16 122 H 32" stroke-width=".9"/>
  <path d="M 20 134 Q 24 130 28 134" stroke-width=".9"/>
  <path d="M 15 146 H 33" stroke-width="1.1"/>

  <!-- 朱点：符胆上唯一的一处红（currentColor 之外只允许的第二种色） -->
  <circle cx="24" cy="98" r="2.4" fill="var(--zhu,currentColor)" stroke="none"/>

  <!-- 符脚：须状收笔 -->
  <path d="M 24 150 V 168" stroke-width="1.5"/>
  <path d="M 24 168 Q 18 182 14 198" stroke-width="1"/>
  <path d="M 24 168 Q 24 184 24 200" stroke-width="1"/>
  <path d="M 24 168 Q 30 182 34 198" stroke-width="1"/>
  <path d="M 14 198 Q 13 206 12 214" stroke-width=".7"/>
  <path d="M 24 200 V 214" stroke-width=".7"/>
  <path d="M 34 198 Q 35 206 36 214" stroke-width=".7"/>

  <!-- 侧栏细线：把符形兜住 -->
  <path d="M 6 6 V 206" stroke-width=".5" opacity=".6"/>
  <path d="M 42 6 V 206" stroke-width=".5" opacity=".6"/>
</svg>
