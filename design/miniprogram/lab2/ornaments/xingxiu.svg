<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" aria-hidden="true">
  <!-- 星点 + 连线：96×96 可平铺（repeat）。
       seam 处理：跨出右沿的两条线在 x=96 的 y 与左沿 x=0 的 y 相同（12 / 74），
       所以 repeat 之后接得上，不会出现断头。
       星点用 currentColor 实心；连线的「宿线」取淡墨变量，比星点再淡一档。 -->
  <g stroke="var(--faint,currentColor)" stroke-linecap="round" fill="none">
    <!-- 宿线（长连线，像二十八宿的串珠） -->
    <path d="M 8 14 L 34 6 L 58 22 L 86 12" stroke-width=".45" opacity=".55"/>
    <path d="M 20 48 L 46 40 L 72 52 L 92 42" stroke-width=".45" opacity=".5"/>
    <path d="M 10 78 L 38 72 L 64 84 L 88 76" stroke-width=".45" opacity=".55"/>
    <!-- 铅垂方向的串接，把三列宿线连成一张网 -->
    <path d="M 34 6 L 20 48 L 38 72" stroke-width=".35" opacity=".38"/>
    <path d="M 58 22 L 72 52 L 64 84" stroke-width=".35" opacity=".38"/>
    <!-- 跨 seam 的两段 -->
    <path d="M 86 12 L 96 12" stroke-width=".45" opacity=".55"/>
    <path d="M 0 12 L 8 14" stroke-width=".45" opacity=".55"/>
    <path d="M 88 76 L 96 74" stroke-width=".45" opacity=".55"/>
    <path d="M 0 74 L 10 78" stroke-width=".45" opacity=".55"/>
  </g>

  <g fill="currentColor">
    <!-- 主星：稍大，带一圈细光环 -->
    <circle cx="58" cy="22" r="1.7"/>
    <circle cx="46" cy="40" r="1.5"/>
    <circle cx="64" cy="84" r="1.5"/>
    <!-- 次星 -->
    <circle cx="8" cy="14" r="1.1"/>
    <circle cx="34" cy="6" r=".9"/>
    <circle cx="86" cy="12" r=".9"/>
    <circle cx="20" cy="48" r="1.1"/>
    <circle cx="72" cy="52" r="1.1"/>
    <circle cx="92" cy="42" r=".8"/>
    <circle cx="10" cy="78" r="1.1"/>
    <circle cx="38" cy="72" r=".9"/>
    <circle cx="88" cy="76" r="1"/>
    <!-- 微尘：不连线的散点，撑满空隙 -->
    <circle cx="26" cy="28" r=".5" opacity=".7"/>
    <circle cx="80" cy="32" r=".5" opacity=".7"/>
    <circle cx="14" cy="62" r=".5" opacity=".7"/>
    <circle cx="54" cy="62" r=".5" opacity=".7"/>
    <circle cx="76" cy="68" r=".5" opacity=".7"/>
    <circle cx="30" cy="90" r=".5" opacity=".7"/>
    <circle cx="48" cy="16" r=".5" opacity=".6"/>
    <circle cx="90" cy="56" r=".5" opacity=".6"/>
  </g>
</svg>
