<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-linecap="butt" aria-hidden="true">
  <!-- 二十八宿细线环：200×200。外环 + 28 道刻度 + 四象限宿距连线 + 内圈。
       抬起角按 360/28 ≈ 12.857° 生成；每 7 宿一条稍长的界线（四象分界）。
       只描线，不填色，颜色由 currentColor 给。 -->
  <circle cx="100" cy="100" r="96" stroke-width=".7"/>
  <circle cx="100" cy="100" r="78" stroke-width=".5"/>
  <circle cx="100" cy="100" r="52" stroke-width=".35" opacity=".7"/>
  <circle cx="100" cy="100" r="20" stroke-width=".35" opacity=".6"/>

  <!-- 28 刻度：用一条线 + rotate 展开，长刻度每 7 道一处 -->
  <g stroke-width=".7">
    <line x1="100" y1="4" x2="100" y2="22"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(12.857 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(25.714 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(38.571 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(51.429 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(64.286 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(77.143 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="34" transform="rotate(90 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(102.857 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(115.714 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(128.571 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(141.429 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(154.286 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(167.143 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="34" transform="rotate(180 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(192.857 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(205.714 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(218.571 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(231.429 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(244.286 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(257.143 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="34" transform="rotate(270 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(282.857 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(295.714 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(308.571 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(321.429 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(334.286 100 100)"/>
    <line x1="100" y1="4" x2="100" y2="22" transform="rotate(347.143 100 100)"/>
  </g>

  <!-- 四象界线：长刻度向内再延伸一截 -->
  <g stroke-width=".45" opacity=".8">
    <line x1="100" y1="34" x2="100" y2="78"/>
    <line x1="100" y1="34" x2="100" y2="78" transform="rotate(90 100 100)"/>
    <line x1="100" y1="34" x2="100" y2="78" transform="rotate(180 100 100)"/>
    <line x1="100" y1="34" x2="100" y2="78" transform="rotate(270 100 100)"/>
  </g>

  <!-- 宿与宿之间的弦线：只连相邻两道刻度，做成星座网 -->
  <g stroke-width=".3" opacity=".55">
    <path d="M 100 22 L 113.6 15.6 L 125 26.3 L 138.4 21.4 L 147.2 33.2"/>
    <path d="M 177.8 100 L 184.4 113.6 L 173.7 125 L 178.6 138.4 L 166.8 147.2"/>
    <path d="M 100 178 L 86.4 184.4 L 75 173.7 L 61.6 178.6 L 52.8 166.8"/>
    <path d="M 22.2 100 L 15.6 86.4 L 26.3 75 L 21.4 61.6 L 33.2 52.8"/>
  </g>

  <!-- 四正位的小菱：把「二十八宿」的方位骨架点出来，不写字 -->
  <g stroke-width=".6" fill="none">
    <path d="M 100 40 L 103.5 44 L 100 48 L 96.5 44 Z"/>
    <path d="M 160 100 L 156 103.5 L 152 100 L 156 96.5 Z"/>
    <path d="M 100 160 L 103.5 156 L 100 152 L 96.5 156 Z"/>
    <path d="M 40 100 L 44 96.5 L 48 100 L 44 103.5 Z"/>
  </g>
</svg>
