[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mingli-tool"
version = "0.1.0"
description = "Local-first deterministic Chinese metaphysics calculation tool"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
mingli = "mingli_tool.cli:main"
mingli-web = "mingli_tool.web:main"

[tool.setuptools]
packages = ["mingli_tool", "scripts"]

[tool.setuptools.package-dir]
mingli_tool = "src/mingli_tool"
scripts = "scripts"
